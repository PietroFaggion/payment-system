spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:payments_db}
    username: ${POSTGRES_USER:payments_user}
    password: ${POSTGRES_PASSWORD:payments_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: localhost:${KAFKA_BROKER_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:payments_db}
    user: ${POSTGRES_USER:payments_user}
    password: ${POSTGRES_PASSWORD:payments_pass}
  task:
    scheduling:
      pool:
        size: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  kafka:
    topics:
      payment-notifications: payment-notifications
  outbox:
    scheduler:
      delay-ms: 5000  # milliseconds between outbox scheduler runs; increase locally to observe intermediate DB states
